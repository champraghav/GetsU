<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#232B1F">
<title>Page not found — GetsU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23232B1F'/%3E%3Ctext x='16' y='24' font-family='Arial Black,Arial,sans-serif' font-style='italic' font-size='21' font-weight='900' fill='%23CC5500' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<style>
/* GitHub Pages serves this file for any missing address, at any depth, so the
   font is addressed from the site root. If the site moves to its own domain
   (e.g. getsu.in), change /GetsU-/ below to just / . */
@font-face{font-family:'Fira Sans';font-style:italic;font-weight:900;font-display:swap;
  src:url('/GetsU-/fonts/fira-sans-900-italic.woff2') format('woff2')}
:root{--sage:#9CAF88;--grey:#A7A7A7;--amber:#CC5500;--amber-press:#A64400;--ink:#1C2418;--ink-soft:#2C3826;--panel:#232B1F;--light:#F0F2EA}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--sage);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;line-height:1.6}
.wrap{max-width:540px;text-align:center}
.logo{font-family:'Fira Sans','Arial Black',Arial,sans-serif;font-weight:900;font-style:italic;font-size:2rem;color:var(--ink);letter-spacing:-.02em;margin-bottom:2.2rem}
.logo b{color:var(--amber)}
.code{display:inline-block;background:var(--panel);color:var(--light);font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:.45rem .9rem;border-radius:8px;margin-bottom:1.3rem}
h1{font-family:'Fira Sans','Arial Black',Arial,sans-serif;font-weight:900;font-style:italic;letter-spacing:-.02em;line-height:1.05;
  font-size:clamp(2.2rem,7vw,3.2rem);margin-bottom:1rem}
p{color:var(--ink-soft);font-size:1.1rem;margin-bottom:2rem}
.actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:.8rem 1.7rem;border-radius:10px;
  font-weight:700;font-size:1rem;text-decoration:none;border:2px solid transparent;transition:background .2s,color .2s}
.btn-primary{background:var(--amber);color:#fff}
.btn-primary:hover{background:var(--amber-press)}
.btn-ghost{color:var(--ink);border-color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--light)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 6px rgba(240,242,234,.85)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Gets<b>U</b></div>
  <div class="code">Error 404</div>
  <h1>This page isn't on the shelf</h1>
  <p>The link may be old, or the page may have moved. The shop is still where you left it.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/GetsU-/#products">Go to the shop</a>
    <a class="btn btn-ghost" href="/GetsU-/">Back to home</a>
  </div>
</div>
</body>
</html>
